name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Engine Test Suites
        run: npm test
        working-directory: ./backend

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ./backend

  build-and-deploy:
    # The engine suites gate the deploy — previously this job went straight
    # from checkout to FTP upload, so a failing calculation could ship.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Passenger reloads only when backend/tmp/restart.txt changes. Nothing in
      # this workflow ever touched it, so an FTP deploy shipped new backend code
      # to a process that carried on running the old code — a server.js fix
      # could sit on the host indefinitely with the broken version still being
      # served, looking exactly like a deploy that never arrived. Writing the
      # commit SHA makes the file differ every run, so the FTP sync uploads it
      # and Passenger picks up the change. Frontend-only pushes restart too,
      # which costs a few seconds and keeps the rule simple.
      #
      # The stamp is written here but uploaded in a SEPARATE step after the
      # code, and backend/tmp is excluded from the main upload below. Sending
      # it with everything else left the order to the FTP client: on the deploy
      # of 0761c62 the trigger arrived before routes/api.js, so Passenger
      # restarted onto the previous code and the new endpoints answered 404
      # while the correct file sat on disk beside them — the same silent
      # failure this step exists to prevent, one layer further in.
      - name: Stamp the Passenger restart trigger
        run: |
          mkdir -p backend/tmp
          echo "$GITHUB_SHA" > backend/tmp/restart.txt

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Local folder to deploy (the entire clean project)
          local-dir: ./
          # Target cPanel folder path (e.g. /home/tecnedub/repositories/knitadvisor/ or specific folder)
          server-dir: ./knitadvisor/
          # dangerous-clean-slate was enabled here and it deleted backend/.env on
          # the server even though the exclude list below names it: clean slate
          # wipes the target directory before it uploads, so exclusions never get
          # a chance to protect anything that exists only on the server. That
          # took production's database credentials with it. Leave this off — the
          # action's default sync already removes files that were deleted from
          # the repo, using the .ftp-deploy-sync-state.json manifest.
          dangerous-clean-slate: false
          # Files to exclude from upload and avoid deleting on the remote server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            backend/.env
            backend/node_modules/**
            database/backups/**
            backend/tmp/**

      # The restart trigger goes up on its own, after every code file has
      # landed. Passenger watches this one file, so uploading it last is what
      # makes "restart" mean "restart onto the code that was just deployed"
      # rather than "restart onto whatever happens to be on disk right now".
      - name: Trigger the Passenger restart
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/tmp/
          server-dir: ./knitadvisor/backend/tmp/
          dangerous-clean-slate: false
          # Its own manifest, so this tiny sync never reasons about the files
          # the main deploy uploaded.
          state-name: .ftp-deploy-restart-state.json
