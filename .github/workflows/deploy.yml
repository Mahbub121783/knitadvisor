name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Engine Test Suites
        run: npm test
        working-directory: ./backend

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ./backend

  build-and-deploy:
    # The engine suites gate the deploy — previously this job went straight
    # from checkout to FTP upload, so a failing calculation could ship.
    #
    # EVERY RUN FROM 30 AUGUST FAILED, AND THE SITE KEPT SERVING 28 AUGUST'S
    # CODE. Thirteen deploys in a row went red and nobody looked, because each
    # one uploaded every file correctly first: the code was on the host, the
    # site answered, and only `uptime` on /health gave it away. Passenger was
    # still running the process it had booted five commits earlier.
    #
    # The FTP step failed, so the restart step after it was skipped, so
    # Passenger never reloaded — and because the step that failed is the one
    # that WRITES the sync manifest, the manifest stayed frozen at the last
    # green run. Every subsequent deploy therefore recomputed the same diff
    # against the same stale manifest and failed the same way. It could not
    # recover on its own, and it did not.
    #
    # What broke it was the 30 August restructure (ea8741e), which moved files
    # into layers and deleted a `scratch/` directory. The action derives its
    # deletions from the manifest, so from then on every run tried to remove
    # paths that the previous failed run had already removed. The run logs
    # would say exactly which path — they need admin rights on the repository
    # to download, which this diagnosis did not have, so it was reached by
    # comparing the host's tree against `git ls-files` instead: every file in
    # the repo was present and correct on the server, and the only things there
    # that the repo no longer had were `scratch/` and a stray root `tmp/`.
    # That is an upload that completes and a cleanup that does not.
    #
    # The repair is to point the main deploy at a NEW manifest name below. With
    # no manifest to diff against, the action uploads everything once and
    # computes no deletions at all, then writes a manifest that matches
    # reality. Nothing is deleted from the host to achieve it and the old
    # manifest is left where it is, so this is reversible by changing one line
    # back.
    #
    # The cost is that `scratch/` and the root `tmp/` stay on the server as
    # orphans. They are inert — three pre-PostgreSQL dev scripts that require
    # a `backend/config/database` module the restructure deleted, and an empty
    # file in a directory Passenger does not watch — so they are dead weight
    # rather than a hazard, and removing them is a separate decision from
    # getting deploys working again.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Passenger reloads only when backend/tmp/restart.txt changes. Nothing in
      # this workflow ever touched it, so an FTP deploy shipped new backend code
      # to a process that carried on running the old code — a server.js fix
      # could sit on the host indefinitely with the broken version still being
      # served, looking exactly like a deploy that never arrived. Writing the
      # commit SHA makes the file differ every run, so the FTP sync uploads it
      # and Passenger picks up the change. Frontend-only pushes restart too,
      # which costs a few seconds and keeps the rule simple.
      #
      # The stamp is written here but uploaded in a SEPARATE step after the
      # code, and backend/tmp is excluded from the main upload below. Sending
      # it with everything else left the order to the FTP client: on the deploy
      # of 0761c62 the trigger arrived before routes/api.js, so Passenger
      # restarted onto the previous code and the new endpoints answered 404
      # while the correct file sat on disk beside them — the same silent
      # failure this step exists to prevent, one layer further in.
      - name: Stamp the Passenger restart trigger
        run: |
          mkdir -p backend/tmp
          echo "$GITHUB_SHA" > backend/tmp/restart.txt

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Local folder to deploy (the entire clean project)
          local-dir: ./
          # Target cPanel folder path (e.g. /home/tecnedub/repositories/knitadvisor/ or specific folder)
          server-dir: ./knitadvisor/
          # dangerous-clean-slate was enabled here and it deleted backend/.env on
          # the server even though the exclude list below names it: clean slate
          # wipes the target directory before it uploads, so exclusions never get
          # a chance to protect anything that exists only on the server. That
          # took production's database credentials with it. Leave this off — the
          # action's default sync already removes files that were deleted from
          # the repo, using the .ftp-deploy-sync-state.json manifest.
          dangerous-clean-slate: false
          # A DELIBERATELY NEW MANIFEST NAME. Read the note above the job for
          # why; the short version is that the old one stopped being updated on
          # 28 August and every run since has failed at this step.
          state-name: .ftp-deploy-sync-state-v2.json
          # Files to exclude from upload and avoid deleting on the remote server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            backend/.env
            backend/node_modules/**
            database/backups/**
            backend/tmp/**

      # The restart trigger goes up on its own, after every code file has
      # landed. Passenger watches this one file, so uploading it last is what
      # makes "restart" mean "restart onto the code that was just deployed"
      # rather than "restart onto whatever happens to be on disk right now".
      - name: Trigger the Passenger restart
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/tmp/
          server-dir: ./knitadvisor/backend/tmp/
          dangerous-clean-slate: false
          # Its own manifest, so this tiny sync never reasons about the files
          # the main deploy uploaded.
          state-name: .ftp-deploy-restart-state.json

      # Assert the deploy actually took. Twice now a run has reported success
      # with the previous revision still answering: once because the restart
      # trigger arrived before the code it activates, and once because the
      # trigger step above did not update it at all. Both were found by hand,
      # days apart, and both looked exactly like a deploy that never happened.
      #
      # /health reports the build the running process booted with, read from
      # the same restart.txt Passenger watches. Comparing it to this commit is
      # the difference between "the files are on the server" and "the server is
      # running them".
      - name: Verify the deployed build is the one serving
        run: |
          set -u
          for i in $(seq 1 20); do
            served=$(curl -fsS --max-time 15 https://knitadvisor.onlinetextileschool.com/health \
                     | sed -n 's/.*"build":"\([^"]*\)".*/\1/p' || true)
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "serving $served after $((i * 15))s"
              exit 0
            fi
            echo "attempt $i: serving '${served:-none}', want $GITHUB_SHA"
            sleep 15
          done
          echo "::error::The site is still serving '${served:-none}' five minutes after deploy."
          echo "Files may be on the host while Passenger runs the previous revision."
          echo "Check that the restart trigger step uploaded backend/tmp/restart.txt."
          exit 1
