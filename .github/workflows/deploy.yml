name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Engine Test Suites
        run: npm test
        working-directory: ./backend

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ./backend

  build-and-deploy:
    # The engine suites gate the deploy — previously this job went straight
    # from checkout to FTP upload, so a failing calculation could ship.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Local folder to deploy (the entire clean project)
          local-dir: ./
          # Target cPanel folder path (e.g. /home/tecnedub/repositories/knitadvisor/ or specific folder)
          server-dir: ./knitadvisor/
          # Optional: Delete old remote files not present in local repo
          dangerous-clean-slate: true
          # Files to exclude from upload and avoid deleting on the remote server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            backend/.env
            backend/node_modules/**
            database/backups/**
